[project]
name = "adastra-speedoflight-2026"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.7.4",
    "langdetect>=1.0.9",
    "numpy>=1.24.0",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pysbd>=0.3.4",
    "pytesseract>=0.3.13",
    "sentence-transformers>=2.2.2",
    "symspellpy>=6.7.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
